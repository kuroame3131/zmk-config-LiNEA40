# keymap-drawer 設定 — JIS(106/109)配列のPCで「実際に入力される文字」を描画する
#
# ZMK のキーコード名は US 配列前提で付けられているため、JIS の PC につなぐと
# 名前と実際の出力がズレる（例: AT = LS(N2) は JIS では " が出る）。
# ここでは描画ラベルだけを JIS の実出力に合わせ、キーマップ画像と実機を一致させる。
#
# 置き場所: リポジトリ直下（draw-zmk.yml の config_path 既定値が keymap_drawer.config.yaml）
# このファイルは draw-keymaps.yml の push パスに既に含まれているので、
# 置くだけで次回から自動生成の画像に反映される。

parse_config:
  raw_binding_map:
    '&kp LS(N1)': '!'
    '&kp LS(N2)': '"'
    '&kp LS(N3)': '#'
    '&kp LS(N4)': $
    '&kp LS(N5)': '%'
    '&kp LS(N6)': '&'
    '&kp LS(N7)': ''''
    '&kp LS(N8)': (
    '&kp LS(N9)': )
    '&kp LS(MINUS)': '='
    '&kp LS(EQUAL)': '~'
    '&kp LS(LBKT)': '`'
    '&kp LS(RBKT)': '{'
    '&kp LS(BSLH)': '}'
    '&kp LS(SEMI)': +
    '&kp LS(SQT)': '*'
    '&kp LS(INT1)': _
    '&kp LS(INT3)': '|'
    '&mkp MB1': 左click
    '&mkp MB2': 右click
    '&mkp MB3': 中click
    '&mkp MB4': 戻る
    '&mkp MB5': 進む
    '&mo 6': Scroll
    '&bootloader': BOOT
    '&studio_unlock': Studio
    '&kp LS(LG(S))': 範囲SS
    '&kp LA(PRINTSCREEN)': 窓SS
    '&kp LC(LA(DEL))': Ctl+Alt+Del
    '&kp LC(LS(ESCAPE))': タスクマネージャ
    '&kp LC(LA(INS))': Ctl+Alt+Ins
    '&kp LG(TAB)': タスクビュー
    '&kp LG(D)': デスクトップ
    '&kp LC(LG(LEFT_ARROW))': 仮想Desk←
    '&kp LC(LG(RIGHT_ARROW))': 仮想Desk→
  zmk_keycode_map:
    EXCLAMATION: '!'
    EXCL: '!'
    AT_SIGN: '"'
    AT: '"'
    HASH: '#'
    POUND: '#'
    DOLLAR: $
    DLLR: $
    PERCENT: '%'
    PRCNT: '%'
    CARET: '&'
    AMPERSAND: ''''
    AMPS: ''''
    ASTERISK: (
    ASTRK: (
    STAR: (
    LEFT_PARENTHESIS: )
    LPAR: )
    RIGHT_PARENTHESIS: (なし)
    RPAR: (なし)
    MINUS: '-'
    UNDERSCORE: '='
    UNDER: '='
    EQUAL: ^
    PLUS: '~'
    LEFT_BRACKET: '@'
    LBKT: '@'
    LEFT_BRACE: '`'
    LBRC: '`'
    RIGHT_BRACKET: '['
    RBKT: '['
    RIGHT_BRACE: '{'
    RBRC: '{'
    BACKSLASH: ']'
    BSLH: ']'
    PIPE: '}'
    SEMICOLON: ;
    SEMI: ;
    COLON: +
    SINGLE_QUOTE: ':'
    SQT: ':'
    APOSTROPHE: ':'
    APOS: ':'
    DOUBLE_QUOTES: '*'
    DQT: '*'
    COMMA: ','
    LESS_THAN: <
    LT: <
    PERIOD: .
    DOT: .
    GREATER_THAN: '>'
    GT: '>'
    SLASH: /
    FSLH: /
    QUESTION: '?'
    QMARK: '?'
    GRAVE: 半角/全角
    TILDE: (JISでは無効)
    TILDE2: (JISでは無効)
    NON_US_BACKSLASH: (JISでは無効)
    NON_US_BSLH: (JISでは無効)
    PIPE2: (JISでは無効)
    NON_US_HASH: (JISでは無効)
    NUHS: (JISでは無効)
    INT1: \
    INT_RO: \
    INTERNATIONAL_1: \
    INT3: ¥
    INT_YEN: ¥
    INTERNATIONAL_3: ¥
    LANG1: かな
    LANG2: 英数
    INT_HENKAN: 変換
    INTERNATIONAL_4: 変換
    INT_MUHENKAN: 無変換
    INTERNATIONAL_5: 無変換
    BACKSPACE: BS
    DELETE: Del
    DEL: Del
    PRINTSCREEN: PrtSc
    PAGE_UP: PgUp
    PAGE_DOWN: PgDn
    LEFT_ARROW: ←
    RIGHT_ARROW: →
    UP_ARROW: ↑
    DOWN_ARROW: ↓
    LEFT_WIN: Win
    LEFT_GUI: Win
    LGUI: Win
    LEFT_SHIFT: Shift
    LSHFT: Shift
    RIGHT_SHIFT: Shift
    RSHFT: Shift
    LEFT_CONTROL: Ctrl
    LCTRL: Ctrl
    RIGHT_CONTROL: Ctrl
    RCTRL: Ctrl
    LEFT_ALT: Alt
    LALT: Alt
    RIGHT_ALT: Alt
    RALT: Alt
    C_VOLUME_DOWN: 音量-
    C_VOLUME_UP: 音量+
    C_MUTE: ミュート
    C_BRI_DN: 輝度-
    C_BRI_UP: 輝度+
draw_config:
  dark_mode: auto
